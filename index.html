<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>아케인 서지 — 1지역 (수직 슬라이스)</title>
<style>
  @font-face{font-family:'Orbitron';src:url('./assets/fonts/Orbitron.ttf') format('truetype');font-weight:400 900;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('./assets/fonts/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('./assets/fonts/Pretendard-Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
  html,body{margin:0;padding:0;height:100%;background:#0b0e1a;overflow:hidden;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  canvas{display:block;}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:5;}
  .stage{font-weight:700;font-size:15px;}
  .stage small{display:block;font-weight:400;font-size:11px;opacity:.85;}
  .stats{text-align:right;font-size:12px;line-height:1.5;}
  .hearts{font-size:15px;letter-spacing:2px;}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,8,16,.82);z-index:10;color:#fff;text-align:center;padding:24px;}
  .overlay h1{font-size:26px;margin:0 0 10px;}
  .overlay p{font-size:14px;line-height:1.7;margin:0 0 22px;color:#cfd8f0;max-width:320px;}
  .go{background:linear-gradient(180deg,#7a5cff,#5338e0);color:#fff;border:0;border-radius:12px;padding:14px 34px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(90,60,220,.45);}
  .go:active{transform:scale(.96);}
  .go:disabled{background:#4a4a66;cursor:wait;box-shadow:none;opacity:.85;}
  .hidden{display:none !important;}
  #combo{display:none;text-align:right;line-height:1.1;margin-top:2px;pointer-events:none;}
  #combo.on{display:block;}
  #combo .cbl{display:block;font-size:9px;letter-spacing:2.5px;color:#c9d2dd;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.5);}
  #combo .cbn{display:block;font-family:'Orbitron','Pretendard',sans-serif;letter-spacing:1px;font-size:26px;font-weight:800;color:var(--cc,#fff);text-shadow:0 1px 2px rgba(0,0,0,.65);}
  #combo .cbar{display:block;height:2px;width:34px;margin:2px 0 0 auto;background:var(--cc,#fff);opacity:.5;border-radius:1px;transform-origin:right center;}
  #combo.hit .cbn{animation:cbn .18s cubic-bezier(.2,1.6,.4,1);}
  #combo.hit .cbar{animation:cbb .3s ease-out;}
  #combo.hit5 .cbn{animation:cbn5 .26s cubic-bezier(.2,1.6,.4,1);}
  #combo.hit5 .cbar{animation:cbb5 .4s ease-out;}
  @keyframes cbn{0%{transform:scale(1);}40%{transform:scale(1.28);}100%{transform:scale(1);}}
  @keyframes cbn5{0%{transform:scale(1);}40%{transform:scale(1.5);}100%{transform:scale(1);}}
  @keyframes cbb{0%{transform:scaleX(1.7);opacity:1;}100%{transform:scaleX(1);opacity:.5;}}
  @keyframes cbb5{0%{transform:scaleX(2.2);opacity:1;}100%{transform:scaleX(1);opacity:.5;}}
  .fps{position:fixed;left:10px;bottom:10px;color:#9fb3d8;font-size:10px;z-index:5;opacity:.8;pointer-events:none;}
</style>
</head>
<body>
<div class="hud">
  <div class="stage"><span id="stageName">1-1 · 시작의 들판</span><small id="sub">수직 슬라이스 · 수치는 초안</small></div>
  <div class="stats">
    <div class="hearts" id="hearts">♥♥♥</div>
    <div>대원 <b id="squadN">1</b> · 레벨 <b id="lv">1</b></div>
    <div>처치 <b id="kills">0</b></div>
    <div id="combo"><span class="cbl">COMBO</span><span class="cbn">&times;0</span><i class="cbar"></i></div>
  </div>
</div>
<div class="fps" id="fps"></div>
<div class="overlay" id="title">
  <h1>아케인 서지</h1>
  <p>1지역 · 시작의 들판 (5구간)<br>소대를 좌우로 드래그(PC는 ←/→ 또는 A/D 키)해 이동합니다.<br>공격은 자동입니다. 보물상자를 부수면 대원이 늘어납니다.</p>
  <button class="go" id="startBtn" disabled>로딩 중… 0%</button>
</div>
<div class="overlay hidden" id="end">
  <h1 id="endTitle"></h1>
  <p id="endBody"></p>
  <button class="go" id="retryBtn">다시 시작</button>
</div>
<script src="./assets/effekseer/effekseer.min.js"></script>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module" src="./main.js"></script>
</body>
</html>
