<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>아케인 서지</title>
<style>
  @font-face{font-family:'Orbitron';src:url('./assets/fonts/Orbitron.ttf') format('truetype');font-weight:400 900;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('./assets/fonts/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('./assets/fonts/Pretendard-Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
  html,body{margin:0;padding:0;height:100%;background:#0b0e1a;overflow:hidden;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  canvas{display:block;}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:5;}
  .stage{font-weight:700;font-size:15px;}
  .stage small{display:block;font-weight:400;font-size:11px;opacity:.85;}
  .stats{text-align:right;font-size:12px;line-height:1.5;}
  .hearts{font-size:15px;letter-spacing:2px;}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,8,16,.82);z-index:10;color:#fff;text-align:center;padding:24px;}
  .overlay h1{font-size:26px;margin:0 0 10px;}
  .overlay p{font-size:14px;line-height:1.7;margin:0 0 22px;color:#cfd8f0;max-width:320px;}
  .go{background:linear-gradient(180deg,#7a5cff,#5338e0);color:#fff;border:0;border-radius:12px;padding:14px 34px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(90,60,220,.45);}
  .go:active{transform:scale(.96);}
  .go:disabled{background:#4a4a66;cursor:wait;box-shadow:none;opacity:.85;}
  .hidden{display:none !important;}
  #combo{display:none;text-align:right;line-height:1.1;margin-top:2px;pointer-events:none;}
  #combo.on{display:block;}
  #combo .cbl{display:block;font-size:9px;letter-spacing:2.5px;color:#c9d2dd;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.5);}
  #combo .cbn{display:block;font-family:'Orbitron','Pretendard',sans-serif;letter-spacing:1px;font-size:26px;font-weight:800;color:var(--cc,#fff);text-shadow:0 1px 2px rgba(0,0,0,.65);}
  #combo .cbar{display:block;height:2px;width:34px;margin:2px 0 0 auto;background:var(--cc,#fff);opacity:.5;border-radius:1px;transform-origin:right center;}
  #combo.hit .cbn{animation:cbn .18s cubic-bezier(.2,1.6,.4,1);}
  #combo.hit .cbar{animation:cbb .3s ease-out;}
  #combo.hit5 .cbn{animation:cbn5 .26s cubic-bezier(.2,1.6,.4,1);}
  #combo.hit5 .cbar{animation:cbb5 .4s ease-out;}
  @keyframes cbn{0%{transform:scale(1);}40%{transform:scale(1.28);}100%{transform:scale(1);}}
  @keyframes cbn5{0%{transform:scale(1);}40%{transform:scale(1.5);}100%{transform:scale(1);}}
  @keyframes cbb{0%{transform:scaleX(1.7);opacity:1;}100%{transform:scaleX(1);opacity:.5;}}
  @keyframes cbb5{0%{transform:scaleX(2.2);opacity:1;}100%{transform:scaleX(1);opacity:.5;}}
  .left{display:flex;flex-direction:column;gap:4px;max-width:58%;}
  .score{line-height:1.15;margin-top:2px;}
  .score .cur b{font-family:'Orbitron','Pretendard',sans-serif;font-size:26px;font-weight:800;letter-spacing:.5px;}
  .score .cur span{font-size:12px;opacity:.85;}
  .score .bestl{font-size:12px;color:#ffe9a8;} .score .bestl em{display:none;font-style:normal;color:#7dff9a;font-weight:700;}
  .score.rec .cur b{color:#7dff9a;} .score.rec .bestl em{display:inline;}
  .mgauge{width:140px;margin-top:2px;} .mbar{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;} .mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a3c,#ffd966);}
  .mtxt{font-size:10px;margin-top:2px;color:#ffe9c8;white-space:nowrap;}
  .banner{position:fixed;left:50%;top:24%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;z-index:6;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);transition:opacity .25s,transform .25s;white-space:nowrap;}
  .banner.show{opacity:1;transform:translate(-50%,0);} .banner b{display:block;font-size:24px;} .banner span{display:block;font-size:13px;margin-top:3px;opacity:.95;}
  .banner.boss b{color:#ffcc55;font-size:28px;} .banner.magic b{color:#ffb25a;} .banner.stage b{font-size:20px;}
  #end{justify-content:flex-start;overflow-y:auto;padding:28px 14px 40px;}
  .dash{width:100%;max-width:360px;text-align:left;color:#e6ecff;}
  .dash .hero{text-align:center;margin-bottom:10px;} .dash .lab{font-size:12px;color:#aab5d8;} .dash .big{font-family:'Orbitron','Pretendard',sans-serif;font-size:54px;font-weight:800;line-height:1.1;} .dash .big small{font-size:18px;}
  .dash .recline{font-size:14px;color:#ffe9a8;margin-top:2px;} .dash .recline.rec{color:#7dff9a;font-weight:700;font-size:16px;}
  .dash .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;} .dash .card{background:rgba(255,255,255,.08);border-radius:8px;padding:8px 4px;text-align:center;} .dash .card b{display:block;font-size:17px;} .dash .card span{font-size:10px;color:#aab5d8;}
  .dash h3{font-size:13px;margin:16px 0 6px;color:#cfd8f0;} .dash .chart{background:rgba(255,255,255,.05);border-radius:8px;display:block;}
  .dash .legend{font-size:10px;color:#aab5d8;margin-top:4px;} .dash .legend i{display:inline-block;width:9px;height:9px;margin:0 3px 0 8px;vertical-align:-1px;border-radius:2px;}
  .dash .cols{display:flex;align-items:flex-end;gap:3px;height:90px;background:rgba(255,255,255,.05);border-radius:8px;padding:6px 6px 0;} .dash .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
  .dash .col i{display:block;width:100%;min-height:2px;border-radius:3px 3px 0 0;} .dash .col em{font-size:8px;font-style:normal;color:#cfd8f0;} .dash .col span{font-size:9px;color:#8c98c4;}
  .dash .stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.08);} .dash .stack i{display:block;height:100%;}
  .dash .br{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px;} .dash .bl{width:86px;color:#cfd8f0;} .dash .bt{flex:1;height:9px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;} .dash .bt i{display:block;height:100%;border-radius:5px;} .dash .bv{width:44px;text-align:right;}
  #end .go{margin-top:20px;}
  .fps{position:fixed;left:10px;bottom:10px;color:#9fb3d8;font-size:10px;z-index:5;opacity:.8;pointer-events:none;}
</style>
</head>
<body>
<div class="hud">
  <div class="left"><div class="stage"><span id="stageName">스테이지 1 · 시작의 들판</span><small id="sub"></small></div>
    <div class="score" id="scoreBox"><div class="cur"><b id="dist">0</b><span> m</span></div><div class="bestl">🏆 최고 <b id="best">0</b> m<em> 신기록!</em></div></div>
    <div class="mgauge"><div class="mbar"><i id="magicBar"></i></div><div class="mtxt" id="magicTxt"></div></div></div>
  <div class="stats">
    <div class="hearts" id="hearts">♥♥♥</div>
    <div>대원 <b id="squadN">1</b> · 레벨 <b id="lv">1</b></div>
    <div>처치 <b id="kills">0</b></div>
    <div id="combo"><span class="cbl">COMBO</span><span class="cbn">&times;0</span><i class="cbar"></i></div>
  </div>
</div>
<div class="fps" id="fps"></div>
<div class="banner" id="banner"></div>
<div class="overlay" id="title">
  <h1>아케인 서지</h1>
  <p>끝없이 이어지는 길을 걸어 최고 거리를 갱신하세요.<br>소대를 좌우로 드래그(PC는 ←/→ 또는 A/D 키)해 이동합니다.<br>공격은 자동입니다. 보물상자를 부수면 대원이 늘어나고, 5스테이지마다 보스가 나타납니다.</p>
  <button class="go" id="startBtn" disabled>로딩 중… 0%</button>
</div>
<div class="overlay hidden" id="end">
  <h1 id="endTitle"></h1>
  <div id="endBody" class="dash"></div>
  <button class="go" id="retryBtn">다시 시작</button>
</div>
<script src="./assets/effekseer/effekseer.min.js"></script>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module" src="./main.js"></script>
</body>
</html>
